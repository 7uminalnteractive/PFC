<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Palpites — Bolão+</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --night: #0A1628;
      --night2: #0F1E35;
      --field: #1B4332;
      --field2: #14532D;
      --gold: #F59E0B;
      --gold-light: #FCD34D;
      --white: #FFFFFF;
      --gray: #E5E7EB;
      --gray-mid: #9CA3AF;
      --border: rgba(255,255,255,0.08);
      --success: #10B981;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--night);
      color: var(--white);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(27,67,50,0.3) 0%, transparent 60%);
      pointer-events: none;
    }

    nav {
      background: rgba(10,22,40,0.9);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
    }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
    }
    .nav-logo span { color: var(--gold); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .nav-user { font-size: 13px; color: var(--gray-mid); }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--gray-mid);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: rgba(239,68,68,0.5); color: #FCA5A5; }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      position: relative;
      z-index: 1;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header-greeting {
      font-size: 13px;
      color: var(--gray-mid);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .header-greeting strong { color: var(--gold); }
    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 44px;
      letter-spacing: 2px;
      line-height: 1;
    }
    .header-sub { font-size: 14px; color: var(--gray-mid); margin-top: 8px; }

    /* ESTADO: enviado */
    #sent-state {
      display: none;
      text-align: center;
    }
    .sent-icon {
      font-size: 64px;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 20px rgba(16,185,129,0.5));
    }
    .sent-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--success);
    }
    .sent-sub { font-size: 15px; color: var(--gray-mid); margin-top: 8px; margin-bottom: 32px; }
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gold);
      color: var(--night);
      border: none;
      border-radius: 12px;
      padding: 16px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.5px;
    }
    .btn-download:hover { background: var(--gold-light); }
    .btn-download:active { transform: scale(0.97); }

    /* GAME CARDS */
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 1.5px;
      color: var(--gray-mid);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .game-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .game-card:hover { border-color: rgba(245,158,11,0.2); }
    .game-card.has-guess { border-color: rgba(245,158,11,0.25); }

    .game-meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .game-competition {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gray-mid);
    }
    .game-date { font-size: 12px; color: var(--gray-mid); }

    .game-matchup {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .team-name {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }
    .team-home { text-align: right; }
    .team-away { text-align: left; }
    .vs-divider {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--gray-mid);
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px 12px;
    }

    /* SCORE INPUT */
    .score-input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .score-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gray-mid);
      text-align: center;
      margin-bottom: 8px;
    }
    .score-wrap { text-align: center; }
    .score-input-group {
      display: flex;
      align-items: center;
      gap: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .score-input-group:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(245,158,11,0.15);
    }
    .score-btn {
      background: transparent;
      border: none;
      color: var(--gray-mid);
      width: 36px;
      height: 48px;
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .score-btn:hover { color: var(--gold); }
    .score-field {
      width: 52px;
      height: 48px;
      background: transparent;
      border: none;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--white);
      outline: none;
    }
    .score-field::-webkit-inner-spin-button,
    .score-field::-webkit-outer-spin-button { -webkit-appearance: none; }

    .score-x {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      color: var(--gray-mid);
      letter-spacing: 1px;
      padding-top: 24px;
    }

    /* FOOTER / SUBMIT */
    .submit-footer {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: rgba(10,22,40,0.97);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      z-index: 50;
    }
    .submit-count {
      font-size: 13px;
      color: var(--gray-mid);
    }
    .submit-count strong { color: var(--gold); }
    .btn-submit {
      background: var(--gold);
      color: var(--night);
      border: none;
      border-radius: 10px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-submit:hover { background: var(--gold-light); }
    .btn-submit:active { transform: scale(0.97); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-mid);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; }

    /* CANVAS HIDDEN */
    #canvas-render { display: none; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">BOLÃO<span>+</span></div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user">—</span>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
</nav>

<div class="container">
  <div class="header">
    <div class="header-greeting">Olá, <strong id="user-name">—</strong></div>
    <div class="header-title">SEUS PALPITES</div>
    <div class="header-sub" id="header-sub">Preencha o placar que você acha que vai ser e envie!</div>
  </div>

  <!-- ESTADO: enviado -->
  <div id="sent-state">
    <div class="sent-icon">✅</div>
    <div class="sent-title">PALPITES ENVIADOS!</div>
    <div class="sent-sub">Seus palpites foram registrados com sucesso.</div>
    <button class="btn-download" onclick="downloadImage()">
      📸 BAIXAR IMAGEM COM PALPITES
    </button>
  </div>

  <!-- FORMULÁRIO DE PALPITES -->
  <div id="games-container">
    <div class="empty-state"><div class="icon">⏳</div><p>Carregando jogos...</p></div>
  </div>
</div>

<!-- RODAPÉ FIXO DE ENVIO -->
<div class="submit-footer" id="submit-footer">
  <div class="submit-count">
    <strong id="filled-count">0</strong> de <strong id="total-count">0</strong> jogos preenchidos
  </div>
  <button class="btn-submit" id="btn-submit" onclick="submitGuesses()">
    ENVIAR PALPITES
  </button>
</div>

<!-- Canvas oculto para gerar imagem -->
<canvas id="canvas-render"></canvas>

<script>
const SUPABASE_URL = 'https://qecmdpcitynwtwnnbnve.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yxsP-KP5ntSlfkTn7nqMjw_-Pfk_ncc';
const ADMIN_EMAIL  = 'pfcpalpitesofc@gmail.com';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let userName = '';
let games = [];
let existingGuesses = {};
let alreadySent = false;
let guessData = []; // para gerar imagem

// ── INIT ──────────────────────────────────────────
(async () => {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { window.location.href = 'index.html'; return; }
  if (user.email === ADMIN_EMAIL) { window.location.href = 'admin.html'; return; }
  currentUser = user;

  // Pega nome do perfil
  const { data: profile } = await sb.from('profiles').select('name').eq('id', user.id).single();
  userName = profile?.name || user.email.split('@')[0];
  document.getElementById('nav-user').textContent = userName;
  document.getElementById('user-name').textContent = userName;

  // Verifica se já enviou
  const { data: prevGuesses } = await sb.from('guesses').select('*').eq('user_id', user.id);
  if (prevGuesses && prevGuesses.length > 0) {
    alreadySent = true;
    prevGuesses.forEach(g => { existingGuesses[g.game_id] = g; });
  }

  await loadGames();
})();

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

// ── LOAD GAMES ────────────────────────────────────
async function loadGames() {
  const { data } = await sb.from('games').select('*').eq('status', 'open').order('match_date', { ascending: true });
  games = data || [];
  renderGames();
}

function renderGames() {
  const container = document.getElementById('games-container');

  if (alreadySent) {
    // Monta dados para imagem a partir dos palpites existentes
    guessData = games.map(g => ({
      home_team: g.home_team,
      away_team: g.away_team,
      home_score: existingGuesses[g.id]?.home_score ?? '?',
      away_score: existingGuesses[g.id]?.away_score ?? '?',
      competition: g.competition || '',
    }));

    container.style.display = 'none';
    document.getElementById('submit-footer').style.display = 'none';
    document.getElementById('sent-state').style.display = 'block';
    return;
  }

  if (!games.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">⚽</div><p>Nenhum jogo disponível no momento.</p></div>';
    document.getElementById('submit-footer').style.display = 'none';
    return;
  }

  document.getElementById('total-count').textContent = games.length;

  container.innerHTML = games.map(g => `
    <div class="game-card" id="card-${g.id}">
      <div class="game-meta-top">
        <span class="game-competition">${g.competition || 'Jogo'}</span>
        <span class="game-date">${g.match_date ? new Date(g.match_date).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}</span>
      </div>
      <div class="game-matchup">
        <div class="team-home">
          <div class="team-name">${g.home_team}</div>
        </div>
        <div class="vs-divider">VS</div>
        <div class="team-away">
          <div class="team-name">${g.away_team}</div>
        </div>
      </div>
      <div class="score-input-row">
        <div class="score-wrap">
          <div class="score-label">Gols ${g.home_team}</div>
          <div class="score-input-group">
            <button class="score-btn" onclick="changeScore('${g.id}','home',-1)">−</button>
            <input class="score-field" type="number" id="home-${g.id}" value="0" min="0" max="20" onchange="updateCount()" oninput="updateCount()" />
            <button class="score-btn" onclick="changeScore('${g.id}','home',1)">+</button>
          </div>
        </div>
        <div class="score-x">×</div>
        <div class="score-wrap">
          <div class="score-label">Gols ${g.away_team}</div>
          <div class="score-input-group">
            <button class="score-btn" onclick="changeScore('${g.id}','away',-1)">−</button>
            <input class="score-field" type="number" id="away-${g.id}" value="0" min="0" max="20" onchange="updateCount()" oninput="updateCount()" />
            <button class="score-btn" onclick="changeScore('${g.id}','away',1)">+</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  updateCount();
}

function changeScore(gameId, side, delta) {
  const el = document.getElementById(side + '-' + gameId);
  const val = Math.max(0, Math.min(20, parseInt(el.value || 0) + delta));
  el.value = val;
  updateCount();
}

function updateCount() {
  // "preenchido" = qualquer campo tocado (todos começam em 0, mas consideramos todos válidos)
  const filled = games.length; // todos os jogos são considerados preenchidos (default 0×0)
  document.getElementById('filled-count').textContent = filled;
}

// ── SUBMIT ────────────────────────────────────────
async function submitGuesses() {
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'ENVIANDO...';

  const rows = games.map(g => ({
    user_id:    currentUser.id,
    game_id:    g.id,
    home_score: parseInt(document.getElementById('home-' + g.id).value) || 0,
    away_score: parseInt(document.getElementById('away-' + g.id).value) || 0,
  }));

  // Upsert (se mandar de novo, atualiza)
  const { error } = await sb.from('guesses').upsert(rows, { onConflict: 'user_id,game_id' });
  if (error) { alert('Erro ao enviar: ' + error.message); btn.disabled = false; btn.textContent = 'ENVIAR PALPITES'; return; }

  // Monta dados para imagem
  guessData = games.map(g => ({
    home_team:  g.home_team,
    away_team:  g.away_team,
    home_score: parseInt(document.getElementById('home-' + g.id).value) || 0,
    away_score: parseInt(document.getElementById('away-' + g.id).value) || 0,
    competition: g.competition || '',
  }));

  alreadySent = true;
  document.getElementById('games-container').style.display = 'none';
  document.getElementById('submit-footer').style.display = 'none';
  document.getElementById('sent-state').style.display = 'block';
}

// ── GERAR IMAGEM ──────────────────────────────────
function downloadImage() {
  const canvas = document.getElementById('canvas-render');
  const W = 600;
  const HEADER = 110;
  const ROW_H = 90;
  const PAD = 28;
  const FOOTER = 50;
  const H = HEADER + (guessData.length * ROW_H) + PAD + FOOTER;

  canvas.width  = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // BG
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0,   '#0A1628');
  bgGrad.addColorStop(0.5, '#0F2040');
  bgGrad.addColorStop(1,   '#0A1628');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Campo radial
  const radGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  radGrad.addColorStop(0,   'rgba(27,67,50,0.35)');
  radGrad.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = radGrad;
  ctx.fillRect(0, 0, W, H);

  // ── HEADER ──
  ctx.fillStyle = '#F59E0B';
  ctx.font = 'bold 13px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('BOLÃO+', W/2, 40);

  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 26px Inter, sans-serif';
  ctx.fillText('PALPITES DE ' + userName.toUpperCase(), W/2, 72);

  ctx.fillStyle = '#9CA3AF';
  ctx.font = '12px Inter, sans-serif';
  const now = new Date().toLocaleString('pt-BR');
  ctx.fillText(now, W/2, 95);

  // Linha divisória
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PAD, 105);
  ctx.lineTo(W - PAD, 105);
  ctx.stroke();

  // ── ROWS ──
  guessData.forEach((g, i) => {
    const y = HEADER + i * ROW_H;
    const isLast = i === guessData.length - 1;

    // Row BG alternado suave
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.025)';
      ctx.beginPath();
      roundRect(ctx, PAD, y + 6, W - PAD*2, ROW_H - 8, 10);
      ctx.fill();
    }

    const midY = y + ROW_H / 2 + 6;

    // Competição
    ctx.fillStyle = '#6B7280';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(g.competition.toUpperCase(), PAD + 12, y + 22);

    // Time casa
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 16px Inter, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(g.home_team, W/2 - 70, midY);

    // Score box
    const boxW = 100, boxH = 38;
    const boxX = W/2 - boxW/2;
    const boxY = midY - 27;
    ctx.fillStyle = 'rgba(245,158,11,0.12)';
    ctx.strokeStyle = 'rgba(245,158,11,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    roundRect(ctx, boxX, boxY, boxW, boxH, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#F59E0B';
    ctx.font = 'bold 22px "Bebas Neue", Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${g.home_score}  ×  ${g.away_score}`, W/2, midY - 5);

    // Time visitante
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 16px Inter, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(g.away_team, W/2 + 70, midY);

    // Separador
    if (!isLast) {
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(PAD, y + ROW_H);
      ctx.lineTo(W - PAD, y + ROW_H);
      ctx.stroke();
    }
  });

  // ── FOOTER ──
  const fy = H - FOOTER + 20;
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = '11px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('bolão+ · palpites entre amigos', W/2, fy);

  // Download
  const link = document.createElement('a');
  link.download = `palpites-${userName.replace(/\s+/g,'-').toLowerCase()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
</script>
</body>
</html>
